[pytest]
testpaths = tests
markers =
    needs_media: requires the reference video projects listed in tests/fixtures/media_manifest.json
    needs_real_media: requires the git-ignored clips in test_media/ (see its README.md)
    slow: takes more than ~30 seconds
    timing: asserts a wall-clock budget; run it on a quiet machine, not in a parallel (-n) run
timeout = 900
