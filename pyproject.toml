[project]
name = "ocr-manager"
version = "3.1.0"
description = "Video OCR crop and brightness configuration tool"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.13"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
]
dependencies = [
    "PyQt6>=6.10.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    # videocr dependencies (now embedded)
    # OCR runs on ONNX Runtime; the DirectML build puts it on any DirectX 12
    # adapter and falls back to the CPU by itself. No CUDA anywhere.
    "onnxruntime-directml>=1.24.0",
    "rapidocr==3.10.0",
    # rapidocr's Arabic route imports bidi while the engine is built.
    "python-bidi>=0.6.0",
    "thefuzz==0.22.1",
    "rapidfuzz>=3.0.0",
    "jieba3>=1.0.0",
    "PyYAML>=6.0.0",
    "packaging>=24.0",
    "setuptools>=61.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
ocr-manager = "app.__main__:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*", "videocr*"]
